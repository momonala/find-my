<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find My dashboard</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <main class="map-shell">
    <div id="map" role="region" aria-label="Map of selected devices' locations over the chosen time range"></div>
    <p id="track-empty" class="empty-state" hidden>No location history for the selected devices in this range.</p>

    <button type="button" id="sidebar-toggle" class="btn-floating sidebar-toggle" aria-label="Open menu" aria-controls="device-list" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="18" height="18">
        <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <div class="map-toolbar">
      <label class="field">
        <span class="visually-hidden">Time range</span>
        <select id="time-range">
          <option value="1">Last hour</option>
          <option value="6">Last 6 hours</option>
          <option value="24" selected>Last 24 hours</option>
          <option value="168">Last 7 days</option>
          <option value="0">All time</option>
        </select>
      </label>
      <button type="button" id="alert-add-open" class="btn-floating">Add alert</button>
      <div class="last-updated-group">
        <p id="last-updated" class="last-updated">—</p>
        <button type="button" id="map-style-open" class="btn-floating btn-icon" aria-label="Map style settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="15" height="15">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Persistent problems (map init failed) that a track refresh should not
         silently clear -- see clearError() in dashboard.js. -->
    <div class="banner-stack">
      <p id="fatal-banner" class="error-banner" role="alert" hidden></p>
      <p id="warning-banner" class="warning-banner" role="status" hidden></p>
      <p id="error-banner" class="error-banner" role="alert" hidden></p>
    </div>

    <aside class="sidebar" aria-label="Devices and items">
      <div class="tab-switcher" role="tablist" aria-label="Category">
        <button type="button" class="tab-button" role="tab" id="tab-device" aria-controls="device-list" data-tab="device">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="18.2" r="1" fill="currentColor"/>
          </svg>
          <span class="tab-label">Devices</span>
        </button>
        <button type="button" class="tab-button" role="tab" id="tab-item" aria-controls="device-list" data-tab="item">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 3h8l10 10-8 8L3 11V3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="7.5" cy="7.5" r="1.4" fill="currentColor"/>
          </svg>
          <span class="tab-label">Items</span>
        </button>
        <button type="button" class="tab-button" role="tab" id="tab-alert" aria-controls="device-list" data-tab="alert">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3l10 18H2L12 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <line x1="12" y1="9.5" x2="12" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="12" cy="16.8" r="0.9" fill="currentColor"/>
          </svg>
          <span class="tab-label">Alerts</span>
        </button>
      </div>

      <div class="sidebar-toolbar" id="device-toolbar">
        <div class="sort-group" role="group" aria-label="Sort by">
          <button type="button" class="sort-chip" data-sort-key="name">Name<span class="sort-indicator"></span></button>
          <button type="button" class="sort-chip" data-sort-key="kind">Kind<span class="sort-indicator"></span></button>
          <button type="button" class="sort-chip" data-sort-key="seen_at">Recent<span class="sort-indicator"></span></button>
          <button type="button" class="sort-chip" data-sort-key="distance">Distance<span class="sort-indicator"></span></button>
        </div>
        <div class="select-actions">
          <button type="button" id="select-all" class="btn-ghost">All</button>
          <button type="button" id="select-none" class="btn-ghost">None</button>
        </div>
      </div>

      <ul id="device-list" class="device-list" role="tabpanel" aria-labelledby="tab-device"></ul>
      <p id="device-empty" class="list-empty" hidden>
        No devices yet. Run the poller (<code>uv run findmy serve</code>) and wait for a fetch cycle.
      </p>
      <p id="alert-empty" class="list-empty" hidden>
        No alerts configured yet. Use the button above to add one.
      </p>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
